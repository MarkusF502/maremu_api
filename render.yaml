databases:
  - name: maremu-db
    plan: free
    databaseName: maremu
    user: maremu

services:
  # API principal (Laravel + Apache em container)
  - type: web
    name: maremu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Maremu
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false # preencher com a URL pública do serviço após o 1º deploy
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: maremu-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_DOMAIN
        value: "" # vazio: backend e frontend estão em domínios diferentes, cookie não pode ter domain fixo
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: "none" # obrigatório para cookie cross-site (Render <-> Vercel) chegar de volta
      - key: SANCTUM_STATEFUL_DOMAINS
        value: maremu-l2cr.vercel.app,maremu.com.br,www.maremu.com.br
      - key: FRONTEND_URL
        sync: false # URL do frontend na Vercel/domínio próprio, usada no CORS (allowed_origins)
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

  # Worker para processar as filas (ex.: AgregarMetricasCategoria)
  - type: worker
    name: maremu-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work --tries=3 --timeout=90
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false # copiar o mesmo valor gerado para o maremu-api
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: maremu-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: false # só o serviço web roda migrate
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
