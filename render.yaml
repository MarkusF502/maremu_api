# Blueprint do Render: cria o web service (Docker) + banco Postgres já
# conectados. Deploy via "New +" > "Blueprint" no dashboard do Render,
# apontando pra este repo (root directory = maremu-api).
#
# Variáveis marcadas com `sync: false` precisam ser preenchidas manualmente
# no dashboard depois do primeiro deploy (não vão pro blueprint por serem
# secrets ou dependerem de uma URL que só existe depois de criar o serviço).

databases:
  - name: maremu-db
    plan: free
    databaseName: maremu
    user: maremu

services:
  # API principal (Laravel + Apache em container)
  - type: web
    name: maremu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Maremu
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false # preencher com a URL pública do serviço após o 1º deploy
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: maremu-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false # https://<seu-projeto>.vercel.app — usada no CORS (allowed_origins)
      - key: VERCEL_PROJECT
        value: maremu # slug do projeto na Vercel, libera CORS pros preview deploys (*.vercel.app)
      # SESSION_*/SANCTUM_STATEFUL_DOMAINS de propósito fora daqui: a auth
      # migrou de cookie de sessão pra Bearer token (Sanctum API Tokens),
      # então não há mais cookie cross-site pra configurar.
      - key: CACHE_STORE
        value: database
      # Sem worker rodando: nada hoje dispara `artisan schedule:run` no
      # Render, então o Schedule::job(AgregarMetricasCategoria)->dailyAt(...)
      # não é acionado de qualquer forma. QUEUE_CONNECTION=sync executa
      # qualquer job na hora (sem precisar de worker) caso algo seja
      # despachado manualmente. Ver observação sobre o Cron Job.
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Seleciona qual provedor de IA gera as sugestões de margem de
      # precificação (ver App\Services\PrecificacaoIaInterface). 'gemini' é
      # o default para não quebrar o comportamento já existente — troque
      # para 'anthropic' no dashboard do Render se quiser rodar com Claude.
      - key: IA_PROVIDER
        value: gemini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
