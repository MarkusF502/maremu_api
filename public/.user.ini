; Endpoints de IA (Gemini/OpenAI) usam Http::timeout(30)->retry(2, 500),
; que no pior caso passa de 90s. O max_execution_time padrão do PHP-FPM (30s)
; matava o request com um Fatal Error antes da resposta voltar pelo pipeline
; de middleware — por isso o Access-Control-Allow-Origin nunca era anexado
; e o navegador reportava (erroneamente) um bloqueio de CORS.
max_execution_time = 120
max_input_time = 120
